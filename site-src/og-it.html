<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#1d1d1f}
.wrap{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:560px 1fr;}
.text{padding:72px 0 0 72px}
.brand{display:flex;align-items:center;gap:14px;font:700 30px/1 inherit;margin-bottom:56px}
.brand img{width:56px;height:56px}
h1{font:800 72px/1.02 inherit;letter-spacing:-0.035em;margin:0 0 24px}
p{font-size:27px;line-height:1.4;color:#5f5f66;margin:0;max-width:20ch}
.scene{position:relative;margin:56px 56px 56px 0;border-radius:28px;background:linear-gradient(160deg,#e9edf5 0%,#dfe5ef 45%,#e8e2ea 100%)}
.scene img{position:absolute;filter:drop-shadow(0 16px 26px rgb(29 29 31 / 20%))}
.o{top:70px;right:-26px;width:560px}.c{left:22px;bottom:56px;width:500px}
.url{position:absolute;left:72px;bottom:56px;font-size:22px;font-weight:600;color:#d42a1f}
</style></head><body><div class="wrap"><div class="text">
<div class="brand"><img src="../build/icon.png" alt="">Cornetta</div>
<h1>Registra le chiamate dal Mac.</h1><p>Qualunque app. La tua voce e quella degli altri, nello stesso file. Gratis.</p></div>
<div class="scene"><img class="o" src="shots/overlay.png" alt=""><img class="c" src="shots/call.png" alt=""></div>
<div class="url">cornetta.stellakamikaze.org</div></div></body></html>
