<title id="t">Esempio: la tua voce prima e dopo il livellatore</title>
<desc id="d">Dati sintetici. Prima la voce di chi registra (blu) è molto più bassa della voce della chiamata (verde); dopo il livellatore le due voci hanno un volume simile.</desc>
