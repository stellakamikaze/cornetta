name = "cornetta"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Solo il dominio vero: niente cornetta.<account>.workers.dev, che aggirerebbe le regole della zona.
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/js/p.js", "/download", "/download/*", "/", "/en/", "/privacy/", "/en/privacy/"]

[[d1_databases]]
binding = "TELEMETRY"
database_name = "cornetta-telemetria"
database_id = "0fb4fa0e-9799-4cb9-b020-8936edbde3f8"

# Limiti col binding ratelimits: senza scritture in KV, e la chiave è un hash dell'IPv4, della /64 o della /48.
# Il periodo può essere solo 10 o 60 secondi, e i contatori valgono per località Cloudflare.
# namespace_id è unico nell'account: 1001 e 1002 li usa il server di Arturo, Cornetta sta su 3001-3004.
# Telemetria: un'app manda pochi eventi (avvio, registrazione, trascrizione), 6 al minuto bastano.
[[ratelimits]]
name = "TELEMETRY_LIMIT"
namespace_id = "3001"
simple = { limit = 6, period = 60 }

# Telemetria per /48 IPv6: chi ne ha una cambia /64 a ogni richiesta. Più largo, è una rete intera.
[[ratelimits]]
name = "TELEMETRY48_LIMIT"
namespace_id = "3004"
simple = { limit = 30, period = 60 }

# Feedback: 2 invii al minuto per IPv4 o /64.
[[ratelimits]]
name = "FEEDBACK_LIMIT"
namespace_id = "3002"
simple = { limit = 2, period = 60 }

# Avvisi Telegram: tetto fisso per tipo (chiavi «download» e «feedback»), 2 al minuto ciascuno.
[[ratelimits]]
name = "ALERT_LIMIT"
namespace_id = "3003"
simple = { limit = 2, period = 60 }

# Ogni notte si cancellano gli eventi di telemetria più vecchi di 12 mesi.
[triggers]
crons = ["17 3 * * *"]

[[kv_namespaces]]
binding = "FEEDBACK"
id = "0071efedaeb74429b6cc2325753f653f"

[[routes]]
pattern = "cornetta.stellakamikaze.org"
custom_domain = true
